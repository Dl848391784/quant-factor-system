# pipelines/pipelines.yaml
# Pipeline 别名 → 数据切割配置
# filter 使用 pandas query 表达式，null 表示不切割（全量）

default:
  filter: null
  description: "全市场全时段"

ob_pool:
  filter: "rsi_6 > 70"
  description: "超买股子集 (RSI>70)，用于超买池内部选股研究"

# ============================================================================
# ob_quality: 路径A第一波 — 超买股 × 高换手率 (Phase 1, 2026-06-28)
# 假设: 高流动性超买股抗跌性更强 → 胜率更高
# 只加 turnover_rate 过滤，后续 Phase 2/3 再加行业和市值
# ============================================================================
ob_quality:
  filter: "rsi_6 > 70 and turnover_rate > 5"
  description: "超买股 × 高换手率 (>5%)，路径A第一波——验证流动性溢价假设"

ob_quality_0624:
  filter: "rsi_6 > 70 and turnover_rate > 5 and date <= '2026-06-24'"
  description: "ob_quality 截止2026-06-24，验证06-24选→06-25买→06-26卖"

ob_quality_0623:
  filter: "rsi_6 > 70 and turnover_rate > 5 and date <= '2026-06-23'"
