# pipelines/pipelines.yaml
# Pipeline 别名 → 数据切割配置
# filter 使用 pandas query 表达式，null 表示不切割（全量）

default:
  filter: null
  description: "全市场全时段"

ob_pool:
  filter: "rsi_6 > 70"
  description: "超买股子集 (RSI>70)，用于超买池内部选股研究"

