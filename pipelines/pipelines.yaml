# pipelines/pipelines.yaml
# Pipeline 别名 → 数据切割配置
# filter 使用 pandas query 表达式，null 表示不切割（全量）

default:
  filter: null
  description: "全市场全时段"

ob_pool:
  filter: "rsi_6 > 70"
  description: "超买股子集 (RSI>70)，用于超买池内部选股研究"

temp_history:
  filter: null
  description: "截止2026-06-24的历史数据，用于验证6月25日选股（手动切割，slicer自动跳过）"

temp_history0623:
  filter: "rsi_6 > 70 and date <= '2026-06-23'"
  description: "RSI>70超买股，数据截止2026-06-23，用于验证6月24日选股"

temp_history0622:
  filter: "rsi_6 > 70 and date <= '2026-06-22'"
  description: "RSI>70超买股，数据截止2026-06-22，用于验证6月23日选股"

temp_history0618:
  filter: "rsi_6 > 70 and date <= '2026-06-18'"
  description: "RSI>70超买股，数据截止2026-06-18，用于验证6月19日选股"

temp_history0617:
  filter: "rsi_6 > 70 and date <= '2026-06-17'"
  description: "RSI>70超买股，数据截止2026-06-17，用于验证6月18日选股"

temp_history0616:
  filter: "rsi_6 > 70 and date <= '2026-06-16'"
  description: "RSI>70超买股，数据截止2026-06-16，用于验证6月17日选股"

temp_history0615:
  filter: "rsi_6 > 70 and date <= '2026-06-15'"
  description: "RSI>70超买股，数据截止2026-06-15，用于验证6月16日选股"

