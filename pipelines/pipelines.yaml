# pipelines/pipelines.yaml
# Pipeline 别名 → 数据切割配置
# filter 使用 pandas query 表达式，null 表示不切割（全量）

default:
  filter: null
  description: "全市场全时段"

# ============================================================================
# ob_quality: 超买股 × 高换手率 (Phase 1, 2026-06-28)
# 假设: 高流动性超买股抗跌性更强 → 胜率更高
# ============================================================================
ob_quality:
  filter: "rsi_6 > 70 and turnover_rate > 5"
  description: "超买股 × 高换手率 (>5%)，路径A第一波——验证流动性溢价假设"
