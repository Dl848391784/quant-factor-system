[project]
name = "factor_ic_analyzer"
version = "1.22.0"
description = "量化因子 IC 分析与分层回测系统"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "baostock>=0.8.9",
    "akshare>=1.10",
    "requests>=2.28",
    "loguru>=0.7",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "ijson>=3.0",
    "scipy>=1.11,<2",  # factor_ic/common/ic_calculator.py 使用 scipy.stats
    "flask>=3.0,<4",  # web_ui 模块（2026-07-04 新增）
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".venv*",  # 虚拟环境（如 .venv_akshare_new）
]
src = ["factor_ic", "backtest", "data_fetchers"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B904",
    "UP",
    "C4",
    "SIM",
    # G004/G003/G201: logger 风格统一（PROJECT.md 硬规则 #13）
    # 仅 factor_ic/ 启用，其他模块在 per-file-ignores 中放行（逐步迁移）
    "G004",  # logging-f-string
    "G003",  # logging-string-concat
    "G201",  # logging-exc-info
]
ignore = [
    "E501",
    "W505",
    "UP017",  # datetime.UTC alias (Python < 3.11 compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["factor_ic", "backtest", "data_fetchers", "common"]
force-single-line = false
combine-as-imports = true  # 同源 from 含 `as` 别名时也合并，避免 PEP 8 同源合并被 isort 拆回（见 factor_ic/ic_kdj_j_1d.py KDJ 默认参数 import）
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# test_*.py 允许 F401 unused import（fixture 间接导入）
"test_*.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_cases"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
log_cli = false
log_level = "WARNING"

[tool.coverage.run]
source = ["factor_ic", "backtest", "data_fetchers"]
omit = ["test_cases/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# import-linter 配置
# 禁止跨模块 import common
[tool.importlinter]
root_package = "."

[[tool.importlinter.contracts]]
name = "Module boundary - no cross-module common import"
type = "independence"
modules = ["factor_ic", "backtest", "comprehensive_factor", "data_fetchers", "summary"]