[project]
name = "factor_ic_analyzer"
version = "1.22.0"
description = "量化因子 IC 分析与分层回测系统"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]
src = ["factor_ic", "backtest", "data_fetchers"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B904",
    "UP",
    "C4",
    "SIM",
]
ignore = [
    "E501",
    "W505",
]

[tool.ruff.lint.isort]
known-first-party = ["factor_ic", "backtest", "data_fetchers", "common"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["test_cases"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["factor_ic", "backtest", "data_fetchers"]
omit = ["test_cases/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# import-linter 配置
# 禁止跨模块 import common
[tool.importlinter]
root_package = "."

[[tool.importlinter.contracts]]
name = "Module boundary - no cross-module common import"
type = "independence"
modules = ["factor_ic", "backtest", "comprehensive_factor", "data_fetchers", "summary"]