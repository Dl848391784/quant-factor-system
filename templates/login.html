<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 因子分析系统</title>
    
    <!-- 统一的基础样式 -->
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 深色主题背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e9ecef;
        }
        
        /* 登录容器 */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        /* 登录卡片 */
        .login-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        /* 标题 */
        .login-card h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 表单组 */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #00d9ff;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #e9ecef;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #00d9ff;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 8px rgba(0,217,255,0.3);
        }
        
        /* 错误提示 */
        .error-message {
            background: rgba(255,82,82,0.15);
            border: 1px solid rgba(255,82,82,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff5252;
            font-size: 0.9em;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* 登录按钮 */
        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,217,255,0.4);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 记住登录选项 */
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }
        
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .remember-me label {
            color: #a0a0a0;
            font-size: 0.9em;
            cursor: pointer;
        }
        
        /* 页脚 */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #a0a0a0;
            font-size: 0.85em;
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>因子分析系统</h1>
            
            <!-- redirect 提示区域 -->
            <div id="loginNotice" style="display: none; background: rgba(0,217,255,0.15); border: 1px solid rgba(0,217,255,0.3); border-radius: 8px; padding: 12px; margin-bottom: 20px; color: #00d9ff; font-size: 0.9em; text-align: center;"></div>
            
            <!-- 错误提示区域 -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- 登录表单 -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" 
                           placeholder="请输入用户名" required 
                           autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" 
                           placeholder="请输入密码" required 
                           autocomplete="current-password">
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住登录（7天有效）</label>
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    登录
                </button>
                
                <!-- 加载动画 -->
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                </div>
            </form>
            
            <!-- 页脚 -->
            <div class="login-footer">
                <p>© 2026 云舟量化系统</p>
            </div>
        </div>
    </div>
    
    <!-- JavaScript 登录逻辑 -->
    <script>
        // DOM 元素
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');
        const loading = document.getElementById('loading');
        
        // 登录处理
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 获取输入值
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // 验证输入
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            // 隐藏错误，显示加载
            hideError();
            showLoading(true);
            loginButton.disabled = true;
            
            try {
                // 发送登录请求
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',  // ← 添加这行，浏览器才会接受 Set-Cookie
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        remember: remember
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 登录成功：Cookie 已由后端设置，无需前端存储 token
                    
                    // 只存储用户信息（用于 UI 显示，非敏感数据）
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('user_id', data.user_id);
                    
                    // 检查是否有 redirect_after_login
                    const redirectUrl = sessionStorage.getItem('redirect_after_login');
                    sessionStorage.removeItem('redirect_after_login');
                    
                    if (redirectUrl) {
                        // 跳转到原目标页面
                        window.location.href = redirectUrl;
                    } else {
                        // 重定向到主页
                        window.location.href = '/';
                    }
                } else {
                    // 登录失败，显示错误信息
                    showError(data.message || '登录失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                console.error('Login error:', error);
            } finally {
                showLoading(false);
                loginButton.disabled = false;
            }
        });
        
        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
        
        // 隐藏错误信息
        function hideError() {
            errorMessage.classList.remove('show');
        }
        
        // 显示/隐藏加载动画
        function showLoading(show) {
            loading.style.display = show ? 'block' : 'none';
        }
        
        // 页面加载时检查是否已登录
        window.addEventListener('load', function() {
            // 检查是否显示 redirect 提示
            const urlParams = new URLSearchParams(window.location.search);
            const needLogin = urlParams.get('need_login');
            const redirectUrl = sessionStorage.getItem('redirect_after_login');
            const loginNotice = document.getElementById('loginNotice');
            
            if (needLogin || redirectUrl) {
                loginNotice.style.display = 'block';
                loginNotice.textContent = redirectUrl 
                    ? '登录后将跳转到: ' + redirectUrl 
                    : '请先登录以访问该页面';
            }
            
            // 使用 Cookie 验证（移除 localStorage 检查）
            fetch('/api/auth/verify', {
                credentials: 'include'  // 发送 Cookie
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Token 有效，直接跳转到主页或 redirect
                    const redirect = sessionStorage.getItem('redirect_after_login');
                    if (redirect) {
                        sessionStorage.removeItem('redirect_after_login');
                        window.location.href = redirect;
                    } else {
                        window.location.href = '/';
                    }
                }
            })
            .catch(error => {
                console.log('Token verification failed:', error);
            });
        });
    </script>
</body>
</html>
